[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-data-automation-hub"
version = "0.1.0"
description = "Legacy Excel/data desktop application with Automation Hub V2 under development."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<2",
    "PyQt5>=5.15,<5.16",
    "PyAutoGUI>=0.9.54,<1",
    "python-docx>=1.1,<2",
    "fuzzywuzzy==0.18.0",
    "python-Levenshtein>=0.25,<0.28",
    "pywin32>=306",
    "openpyxl>=3.1,<4",
    "opencv-python>=4.8,<4.12",
    "PyDirectInput>=1,<2",
    "PyYAML>=6,<7",
    "pywinauto==0.6.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["automation*", "final_cal*", "price*", "ui*"]
exclude = ["build*", "dist*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "ui_integration: requires an interactive Windows desktop and installed target application",
]
